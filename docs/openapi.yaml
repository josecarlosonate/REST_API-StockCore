openapi: 3.1.0

info:
  title: StockCore API
  version: 1.0.0
  description: REST API for inventory and sales management built with Laravel.

servers:
  - url: http://localhost:8000/api/v1
    description: Local development server

paths:
  /login:
    post:
      summary: Authenticate user
      description: Authenticates a user and returns a Laravel Sanctum access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
              required:
                - email
                - password
      responses:
        "200":
          description: User authenticated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
                        format: email
                    required:
                      - id
                      - name
                      - email
                  token:
                    type: string
                required:
                  - user
                  - token
        "401":
          description: Invalid credentials.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "422":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
  /logout:
    post:
      summary: Logout user
      description: Revokes the current Laravel Sanctum access token.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User logged out successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
        - message
        - errors
